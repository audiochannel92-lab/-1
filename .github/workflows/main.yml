    <!-- MAIN APP LOGIC -->
    <script>
        /* STATE & THEME */
        let state = { xp: 0, level: 1, isDark: false };

        function toggleTheme() {
            state.isDark = !state.isDark;
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');

            if (state.isDark) {
                body.classList.remove('light');
                body.classList.add('dark');
                icon.className = "fas fa-sun text-amber-300";
                text.innerText = "День";
            } else {
                body.classList.remove('dark');
                body.classList.add('light');
                icon.className = "fas fa-moon text-amber-400";
                text.innerText = "Ночь";
            }
        }

        /* AUDIO SYNTHESIZER */
        let audioCtx = null;
        let ambientOsc = null, ambientGain = null;
        let isAudioPlaying = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function toggleAudio() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const icon = document.getElementById('audioIcon');
            const text = document.getElementById('audioText');

            if (!isAudioPlaying) {
                ambientOsc = audioCtx.createOscillator();
                ambientGain = audioCtx.createGain();
                ambientOsc.type = 'sine';
                ambientOsc.frequency.setValueAtTime(216, audioCtx.currentTime);
                ambientGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                ambientOsc.connect(ambientGain);
                ambientGain.connect(audioCtx.destination);
                ambientOsc.start();

                isAudioPlaying = true;
                icon.className = "fas fa-volume-up text-emerald-400 animate-pulse";
                text.innerText = "Альфа: Вкл";
            } else {
                if (ambientGain) ambientGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
                setTimeout(() => { if (ambientOsc) ambientOsc.stop(); }, 300);
                isAudioPlaying = false;
                icon.className = "fas fa-volume-mute text-pink-400";
                text.innerText = "Альфа-Звук";
            }
        }

        function playTone(freq, duration = 0.2, type = 'sine') {
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function playBreathingTone(isInhale, durationSeconds) {
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';

                const startFreq = isInhale ? 180 : 320;
                const endFreq = isInhale ? 320 : 180;

                osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + durationSeconds);

                gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + (durationSeconds / 2));
                gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + durationSeconds);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + durationSeconds);
            } catch(e){}
        }

        /* XP & REWARDS */
        function addXP(amount) {
            state.xp += amount;
            if (state.xp >= state.level * 100) {
                state.xp -= state.level * 100;
                state.level++;
                showModal("НОВЫЙ НЕЙРО-УРОВЕНЬ!", `Ты достиг ${state.level} уровня фокуса и силы воли!`);
            }
            document.getElementById('userLevel').innerText = state.level;
            document.getElementById('userXP').innerText = `${state.xp} XP`;
            playTone(528, 0.4);
        }

        /* TABS NAVIGATION */
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.add('opacity-60'));
            
            document.getElementById(`section-${tabId}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${tabId}`);
            activeBtn.classList.remove('opacity-60');

            if (tabId === 'memory') initSymbolGrid();
        }

        /* BREATHING SYSTEM (WIM HOF & 4-7-8) */
        let wimMode = 'classic';
        let wimActive = false;
        let wimBreathsCount = 0;
        let wimMaxBreaths = 30;
        let wimPhase = 'breathe'; // 'breathe', 'hold', 'recovery'
        let wimTimer = null;
        let wimHoldSeconds = 0;
        let wimMaxHold = 0;
        let relaxSubPhase = 'inhale'; // For 4-7-8 mode: 'inhale', 'hold', 'exhale'

        function toggleBreathDesc(descId) {
            const el = document.getElementById(descId);
            el.classList.toggle('hidden');
        }

        function selectWimMode(mode) {
            if (wimActive) return;
            wimMode = mode;
            
            document.querySelectorAll('#wbox-classic, #wbox-express, #wbox-relax').forEach(box => {
                box.classList.remove('border-2', 'border-purple-400', 'border-pink-400', 'border-cyan-400');
            });

            if (mode === 'classic') {
                wimMaxBreaths = 30;
                document.getElementById('wbox-classic').classList.add('border-2', 'border-purple-400');
            } else if (mode === 'express') {
                wimMaxBreaths = 15;
                document.getElementById('wbox-express').classList.add('border-2', 'border-pink-400');
            } else if (mode === 'relax') {
                wimMaxBreaths = 4; // 4 cycles for 4-7-8
                document.getElementById('wbox-relax').classList.add('border-2', 'border-cyan-400');
            }
        }

        function toggleWimHofSession() {
            const btn = document.getElementById('wimStartBtn');
            if (!wimActive) {
                wimActive = true;
                wimBreathsCount = 0;
                wimPhase = 'breathe';
                relaxSubPhase = 'inhale';
                btn.innerText = "Завершить Практику";
                runWimCycle();
            } else {
                wimActive = false;
                clearTimeout(wimTimer);
                btn.innerText = "Начать Практику";
                document.getElementById('wimStatus').innerText = "Готов?";
                document.getElementById('wimCounter').innerText = "Нажми Старт";
                document.getElementById('wimPhaseText').innerText = "Подготовка";
                document.getElementById('wimSphere').style.transform = "scale(1)";
            }
        }

        function runWimCycle() {
            if (!wimActive) return;

            const sphere = document.getElementById('wimSphere');
            const status = document.getElementById('wimStatus');
            const counter = document.getElementById('wimCounter');
            const phaseText = document.getElementById('wimPhaseText');

            // MODE 3: 4-7-8 SPECIFIC LOGIC
            if (wimMode === 'relax') {
                phaseText.innerText = "Метод 4-7-8: Глубокий Релакс";
                
                if (relaxSubPhase === 'inhale') {
                    status.innerText = "Вдох (4 сек)";
                    counter.innerText = `Цикл ${wimBreathsCount + 1} / ${wimMaxBreaths}`;
                    sphere.style.transform = "scale(1.5)";
                    playBreathingTone(true, 4);

                    wimTimer = setTimeout(() => {
                        if (!wimActive) return;
                        relaxSubPhase = 'hold';
                        runWimCycle();
                    }, 4000);
                } else if (relaxSubPhase === 'hold') {
                    status.innerText = "Задержка (7 сек)";
                    counter.innerText = "Сохраняй покой";
                    sphere.style.transform = "scale(1.5)";
                    playTone(220, 0.2);

                    wimTimer = setTimeout(() => {
                        if (!wimActive) return;
                        relaxSubPhase = 'exhale';
                        runWimCycle();
                    }, 7000);
                } else if (relaxSubPhase === 'exhale') {
                    status.innerText = "Выдох (8 сек)";
                    counter.innerText = "Плавное расслабление";
                    sphere.style.transform = "scale(0.85)";
                    playBreathingTone(false, 8);

                    wimTimer = setTimeout(() => {
                        if (!wimActive) return;
                        wimBreathsCount++;
                        if (wimBreathsCount >= wimMaxBreaths) {
                            addXP(50);
                            showModal("4-7-8 ЗАВЕРШЕНО!", "Нервная система переведена в состояние глубокого восстановления!");
                            toggleWimHofSession();
                        } else {
                            relaxSubPhase = 'inhale';
                            runWimCycle();
                        }
                    }, 8000);
                }
                return;
            }

            // CLASSIC / EXPRESS WIM HOF LOGIC
            if (wimPhase === 'breathe') {
                phaseText.innerText = "Фаза 1: Силовое Дыхание";
                wimBreathsCount++;
                status.innerText = "Вдох / Выдох";
                counter.innerText = `${wimBreathsCount} / ${wimMaxBreaths}`;

                const duration = wimMode === 'express' ? 1.4 : 2.0;

                // Inhale
                sphere.style.transform = "scale(1.45)";
                playBreathingTone(true, duration / 2);

                setTimeout(() => {
                    if (!wimActive) return;
                    // Exhale
                    sphere.style.transform = "scale(0.85)";
                    playBreathingTone(false, duration / 2);
                }, (duration / 2) * 1000);

                if (wimBreathsCount >= wimMaxBreaths) {
                    wimPhase = 'hold';
                    wimHoldSeconds = 0;
                    setTimeout(runWimCycle, duration * 1000 + 300);
                } else {
                    wimTimer = setTimeout(runWimCycle, duration * 1000 + 200);
                }
            } else if (wimPhase === 'hold') {
                phaseText.innerText = "Фаза 2: Задержка на Выдохе";
                status.innerText = "ЗАДЕРЖКА";
                counter.innerText = `${wimHoldSeconds} сек`;
                sphere.style.transform = "scale(1)";

                wimHoldSeconds++;
                if (wimHoldSeconds > wimMaxHold) {
                    wimMaxHold = wimHoldSeconds;
                    document.getElementById('wimMaxHoldText').innerText = `${wimMaxHold} сек`;
                }

                playTone(160, 0.08);

                if (wimHoldSeconds >= (wimMode === 'express' ? 30 : 60)) {
                    wimPhase = 'recovery';
                    runWimCycle();
                } else {
                    wimTimer = setTimeout(runWimCycle, 1000);
                }
            } else if (wimPhase === 'recovery') {
                phaseText.innerText = "Фаза 3: Восстановительный Вдох";
                status.innerText = "Задержка 15 сек";
                counter.innerText = "Глубокий Вдох";
                sphere.style.transform = "scale(1.5)";
                playTone(432, 1.2);

                setTimeout(() => {
                    addXP(60);
                    showModal("ПРОТОКОЛ ВЕЛИКОЛЕПНО ЗАВЕРШЁН!", `Ты прошел полный цикл дыхания Вима Хофа! Макс. задержка: ${wimMaxHold} сек (+60 XP).`);
                    toggleWimHofSession();
                }, 15000);
            }
        }

        /* CONFIDENCE TRAINER FUNCTIONS */
        let poseInterval = null;

        function startPoseTimer() {
            if (poseInterval) clearInterval(poseInterval);
            let left = 120;
            const display = document.getElementById('poseTimerDisplay');
            const btn = document.getElementById('poseBtn');
            btn.disabled = true;

            poseInterval = setInterval(() => {
                left--;
                const m = Math.floor(left / 60);
                const s = left % 60;
                display.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

                if (left % 10 === 0) playTone(300, 0.1);

                if (left <= 0) {
                    clearInterval(poseInterval);
                    btn.disabled = false;
                    display.innerText = "02:00";
                    addXP(40);
                    showModal("СОМАТИЧЕСКИЙ ЯКОРЬ ЗАКРЕПЛЁН!", "Ты удерживал Позу Силы 2 минуты. Физиологический баланс уверенности активирован!");
                }
            }, 1000);
        }

        function triggerSwishPattern() {
            const weak = document.getElementById('swishWeak');
            const strong = document.getElementById('swishStrong');

            playTone(200, 0.1);
            setTimeout(() => playTone(800, 0.4, 'triangle'), 300);

            weak.style.opacity = '0';
            weak.style.transform = 'scale(0.2)';

            strong.style.opacity = '1';
            strong.style.transform = 'scale(1)';

            setTimeout(() => {
                addXP(20);
            }, 600);

            setTimeout(() => {
                weak.style.opacity = '0.8';
                weak.style.transform = 'scale(1)';
                strong.style.opacity = '0';
                strong.style.transform = 'scale(0.5)';
            }, 3000);
        }

        const confPhrases = [
            "Моя воля — это невидимый руль моей реальности.",
            "Я абсолютно спокоен, собран и незыблем в любых условиях.",
            "Мой голос несёт силу, а моё присутствие излучает уверенность.",
            "Дисциплина — это моя главная суперсила и источник свободы."
        ];
        let confIdx = 0;

        function nextConfPhrase() {
            confIdx = (confIdx + 1) % confPhrases.length;
            document.getElementById('confPhraseDisplay').innerText = confPhrases[confIdx];
        }

        function calibrateVoiceState() {
            playTone(440, 0.3);
            addXP(15);
            showModal("ГОЛОСОВОЙ ЯКОРЬ ЗАФИКСИРОВАН", "Нейронный отклик уверенности активирован!");
        }

        /* MEMORY GAME 1: COLOR CODE */
        let colorSeq = [];
        let userColorSeq = [];
        const colorTypes = ['pink', 'purple', 'cyan', 'yellow'];

        function startColorGame() {
            colorSeq = [];
            userColorSeq = [];
            nextColorStep();
        }

        function nextColorStep() {
            userColorSeq = [];
            colorSeq.push(colorTypes[Math.floor(Math.random() * colorTypes.length)]);
            document.getElementById('colorScore').innerText = `Длина кода: ${colorSeq.length}`;

            let delay = 300;
            colorSeq.forEach((color) => {
                setTimeout(() => {
                    flashColorBall(color);
                }, delay);
                delay += 600;
            });
        }

        function flashColorBall(color) {
            const ball = document.getElementById(`cball-${color}`);
            if (!ball) return;
            ball.classList.add('active-glow');
            playTone(color === 'pink' ? 300 : color === 'purple' ? 400 : color === 'cyan' ? 500 : 600, 0.2);
            setTimeout(() => {
                ball.classList.remove('active-glow');
            }, 350);
        }

        function pressColorBall(color) {
            flashColorBall(color);
            userColorSeq.push(color);

            const curr = userColorSeq.length - 1;
            if (userColorSeq[curr] !== colorSeq[curr]) {
                playTone(120, 0.3, 'sawtooth');
                showModal("ОШИБКА В КОДЕ", "Последовательность цветов сбилась. Попробуй сначала!");
                colorSeq = [];
                userColorSeq = [];
                return;
            }

            if (userColorSeq.length === colorSeq.length) {
                addXP(20);
                setTimeout(nextColorStep, 700);
            }
        }

        /* MEMORY GAME 2: DIGIT SPAN WITH NUMPAD */
        let currentDigitStr = "";
        let enteredDigits = "";

        function startDigitGame() {
            const len = 3 + Math.floor(state.xp / 60);
            currentDigitStr = Array.from({length: len}, () => Math.floor(Math.random() * 10)).join('');
            document.getElementById('digitDisplay').innerText = currentDigitStr;
            enteredDigits = "";
            updateEnteredDigitDisplay();

            setTimeout(() => {
                document.getElementById('digitDisplay').innerText = "???";
            }, 1600);
        }

        function pressNumpad(num) {
            if (enteredDigits.length < 12) {
                enteredDigits += num;
                playTone(400 + parseInt(num) * 30, 0.1);
                updateEnteredDigitDisplay();
            }
        }

        function clearNumpad() {
            enteredDigits = enteredDigits.slice(0, -1);
            playTone(200, 0.1);
            updateEnteredDigitDisplay();
        }

        function updateEnteredDigitDisplay() {
            document.getElementById('digitInputArea').innerText = enteredDigits || " ";
        }

        function checkDigitAnswer() {
            if (enteredDigits === currentDigitStr && currentDigitStr !== "") {
                addXP(25);
                showModal("ВЕРНО!", `Цифровая последовательность [${currentDigitStr}] воспроизведена без ошибок.`);
                enteredDigits = "";
                currentDigitStr = "";
                updateEnteredDigitDisplay();
                document.getElementById('digitDisplay').innerText = "---";
            } else {
                playTone(120, 0.3, 'sawtooth');
                showModal("ОШИБКА", `Правильное число было: ${currentDigitStr || 'Не запущен тест'}`);
            }
        }

        /* MEMORY GAME 3: NEURO SYMBOLS */
        const symbolIcons = ['🌟', '⚡', '🌀', '🔮', '💎', '🚀', '🎯', '🪐', '🎨'];
        let targetSymbols = [];
        let userPickedSymbols = [];

        function initSymbolGrid() {
            const grid = document.getElementById('symbolGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const card = document.createElement('button');
                card.id = `scard-${i}`;
                card.className = 'symbol-card w-full h-full rounded-2xl glass-pill flex items-center justify-center text-xl font-bold bg-white/40 dark:bg-slate-800/40 border border-purple-300/30 bubble-btn';
                card.innerText = '❓';
                card.onclick = () => pickSymbolCard(i);
                grid.appendChild(card);
            }
        }

        function startSymbolGame() {
            initSymbolGrid();
            targetSymbols = [];
            userPickedSymbols = [];

            while(targetSymbols.length < 3) {
                let r = Math.floor(Math.random() * 9);
                if (!targetSymbols.includes(r)) targetSymbols.push(r);
            }

            targetSymbols.forEach((cardIdx, i) => {
                const card = document.getElementById(`scard-${cardIdx}`);
                card.innerText = symbolIcons[i];
                card.classList.add('bg-pink-300/50', 'text-pink-600');
            });

            setTimeout(() => {
                targetSymbols.forEach((cardIdx) => {
                    const card = document.getElementById(`scard-${cardIdx}`);
                    card.innerText = '❓';
                    card.classList.remove('bg-pink-300/50', 'text-pink-600');
                });
            }, 2000);
        }

        function pickSymbolCard(idx) {
            if (targetSymbols.length === 0) return;

            const card = document.getElementById(`scard-${idx}`);
            if (targetSymbols.includes(idx) && !userPickedSymbols.includes(idx)) {
                userPickedSymbols.push(idx);
                card.innerText = '✨';
                card.classList.add('bg-emerald-300/50');
                playTone(500, 0.2);

                if (userPickedSymbols.length === targetSymbols.length) {
                    addXP(30);
                    showModal("ОТЛИЧНО!", "Все нейро-символы найдены с высокой точностью!");
                    targetSymbols = [];
                }
            } else if (!targetSymbols.includes(idx)) {
                playTone(120, 0.3, 'sawtooth');
                card.innerText = '❌';
                showModal("ОШИБКА", "Карточка оказалась пустой!");
                targetSymbols = [];
            }
        }

        /* SPEECH TRAINERS */
        function switchSpeechSub(subId) {
            document.querySelectorAll('.speech-subgame').forEach(el => el.classList.add('hidden'));
            document.getElementById(`speech-${subId}`).classList.remove('hidden');
        }

        function switchMemGame(gameId) {
            document.querySelectorAll('.mem-subgame').forEach(el => el.classList.add('hidden'));
            document.getElementById(`mem-${gameId}`).classList.remove('hidden');
            if (gameId === 'symbols') initSymbolGrid();
        }

        let metroInterval = null;
        let isMetroOn = false;
        let bpm = 90;

        function updateBPM(val) {
            bpm = val;
            document.getElementById('bpmVal').innerText = val;
            if (isMetroOn) {
                toggleMetronome();
                toggleMetronome();
            }
        }

        function toggleMetronome() {
            const btn = document.getElementById('metroBtn');
            if (!isMetroOn) {
                isMetroOn = true;
                btn.innerText = "Стоп";
                metroInterval = setInterval(() => playTone(800, 0.05), (60 / bpm) * 1000);
            } else {
                isMetroOn = false;
                btn.innerText = "Вкл Метроном";
                clearInterval(metroInterval);
            }
        }

        const twistersList = [
            "Рододендроны из района реконструированы в риторический ритм",
            "Сшить ситцевый сарафан для стоического самообладания и фокуса",
            "Клара крали кларионы пока Карл конструировал концепты воли"
        ];
        let twisterIdx = 0;

        function nextTwister() {
            twisterIdx = (twisterIdx + 1) % twistersList.length;
            document.getElementById('twisterText').innerText = twistersList[twisterIdx];
            addXP(10);
        }

        const flowTopics = [
            "Почему сон, питание и спорт формируют безупречную дисциплину",
            "Как направить внимание на ключевую цель без отвлечений",
            "Влияние гипнотической паузы в публичном выступлении",
            "Управление своими эмоциями через дыхательные практики"
        ];

        function startFlowTimer() {
            const topic = flowTopics[Math.floor(Math.random() * flowTopics.length)];
            document.getElementById('flowTopic').innerText = topic;

            let left = 30;
            const timerEl = document.getElementById('flowTimer');

            const interval = setInterval(() => {
                left--;
                timerEl.innerText = `00:${String(left).padStart(2, '0')}`;
                if (left <= 0) {
                    clearInterval(interval);
                    addXP(30);
                    showModal("ОТЛИЧНЫЙ ПОТОК!", "30 секунд беспрерывной монологовой речи завершены.");
                }
            }, 1000);
        }

        const sprintThoughts = [
            "Упорный труд и регулярные тренировки всегда приводят к результату.",
            "Дисциплина — это умение делать то, что нужно, даже когда не хочется.",
            "То, куда нацелено твоё внимание, определяет твоё будущее.",
            "Качественный сон восстанавливает нервную систему эффективнее любых лекарств."
        ];
        let sprintIdx = 0;

        function nextSprintThought() {
            sprintIdx = (sprintIdx + 1) % sprintThoughts.length;
            document.getElementById('sprintThought').innerText = sprintThoughts[sprintIdx];
        }

        function startSprintTimer() {
            let left = 30;
            const display = document.getElementById('sprintTimerDisplay');
            const interval = setInterval(() => {
                left--;
                display.innerText = `00:${String(left).padStart(2, '0')}`;
                if (left <= 0) {
                    clearInterval(interval);
                    addXP(35);
                    showModal("СПРИНТ ЗАВЕРШЕН!", "Ты успешно перефразировал мысль тремя речевыми конструкциями!");
                }
            }, 1000);
        }

        /* EXTENDED AFFIRMATIONS */
        const affs = [
            "То, куда ты направляешь свою волю и внимание, становится твоей реальностью.",
            "Сон, питание и физическая нагрузка — три фундаментальных источника моей энергии.",
            "Моя дисциплина сильнее временных эмоций и минутных отвлечений.",
            "Каждый день я создаю структуру, которая делает мой успех неизбежным.",
            "Мой голос звучит глубоко, уверенно и убедительно.",
            "Мой разум сфокусирован, словно лазер, направленный в одну точку."
        ];
        let affIndex = 0;

        function nextAffirmation() {
            affIndex = (affIndex + 1) % affs.length;
            document.getElementById('affBanner').innerText = affs[affIndex];
        }

        /* MODAL CONTROLS */
        function showModal(title, desc) {
            document.getElementById('rewardTitle').innerText = title;
            document.getElementById('rewardDesc').innerText = desc;
            const modal = document.getElementById('rewardModal');
            const card = document.getElementById('rewardModalCard');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-90');
            card.classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('rewardModal');
            const card = document.getElementById('rewardModalCard');
            card.classList.remove('scale-100');
            card.classList.add('scale-90');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }


        /* NEUROBLOOM POLISH: scroll progress + resilient UI defaults */
        function updateScrollProgress() {
            const bar = document.getElementById('scrollProgress');
            if (!bar) return;
            const max = document.documentElement.scrollHeight - window.innerHeight;
            bar.style.width = (max > 0 ? (window.scrollY / max) * 100 : 0) + '%';
        }
        window.addEventListener('scroll', updateScrollProgress, { passive: true });
        window.addEventListener('resize', updateScrollProgress);
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                const modal = document.getElementById('rewardModal');
                if (modal && !modal.classList.contains('opacity-0')) closeModal();
            }
        });

        window.onload = function() {
            initSymbolGrid();
            updateScrollProgress();
        };
    </script>
</body>
</html>
