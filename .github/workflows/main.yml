<!DOCTYPE html>
<html lang="ru" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5e8ff">
    <meta name="description" content="Интерактивная нейро-тренировка: дыхание, уверенность, память и речь.">
    <title>NeuroBloom — пространство фокуса</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        gum: {
                            pink: '#FFB7D5',
                            lightPink: '#FFF0F5',
                            lavender: '#E2D5F8',
                            mint: '#C1F0E7',
                            sky: '#CBE6FF',
                            yellow: '#FFF3B0',
                        }
                    },
                    borderRadius: {
                        '4xl': '2rem',
                        '5xl': '2.5rem',
                        '6xl': '3rem'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            transition: background-color 0.5s ease, color 0.5s ease;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        body.light {
            background: linear-gradient(135deg, #FFF0F5 0%, #E8F3FF 50%, #F5E8FF 100%);
            background-attachment: fixed;
            color: #334155;
        }

        body.dark {
            background: linear-gradient(135deg, #090D16 0%, #111827 50%, #1E1029 100%);
            background-attachment: fixed;
            color: #F1F5F9;
        }

        .glass-card {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.4s ease;
        }
        .light .glass-card {
            background: rgba(255, 255, 255, 0.78);
            border: 2px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 20px 40px -15px rgba(255, 183, 213, 0.35);
        }
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.75);
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        .glass-pill {
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .light .glass-pill {
            background: rgba(255, 255, 255, 0.85);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
        }
        .dark .glass-pill {
            background: rgba(51, 65, 85, 0.7);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
        }

        /* Unified Spring Button Touch Feedback */
        button, .bubble-btn {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, opacity 0.2s ease;
            outline: none;
        }
        button:active, .bubble-btn:active {
            transform: scale(0.92) !important;
        }
        button:hover, .bubble-btn:hover {
            transform: translateY(-2px) scale(1.02);
        }

        .floating {
            animation: floatSlow 6s ease-in-out infinite;
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        #wimSphere {
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.5s ease;
        }

        .color-ball {
            transition: all 0.25s ease;
        }
        .color-ball.active-glow {
            transform: scale(1.18);
            box-shadow: 0 0 30px currentColor;
        }

        .swish-image {
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #A855F7; border-radius: 20px; }
    </style>

    <style id="neurobloom-enhancements">
        :root { --nb-pink:#ff83bd; --nb-violet:#9b7bff; --nb-cyan:#69dce8; --nb-ink:#302a4a; }
        html { scroll-behavior:smooth; }
        body { position:relative; isolation:isolate; }
        body::before {
            content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
            background-image: radial-gradient(circle at 12% 18%, rgba(255,183,213,.24) 0 2px, transparent 3px),
                              radial-gradient(circle at 83% 28%, rgba(155,123,255,.18) 0 2px, transparent 3px),
                              radial-gradient(circle at 65% 82%, rgba(105,220,232,.2) 0 2px, transparent 3px);
            background-size: 120px 140px, 170px 180px, 210px 190px;
            animation: starDrift 24s linear infinite;
        }
        .ambient-orbs { position:fixed; inset:0; overflow:hidden; z-index:-1; pointer-events:none; }
        .ambient-orb { position:absolute; width:clamp(110px,18vw,260px); aspect-ratio:1; border-radius:50%;
            filter:blur(42px); opacity:.24; animation: orbFloat 13s ease-in-out infinite; }
        .ambient-orb.one { background:#ff9bc9; top:12%; left:-5%; }
        .ambient-orb.two { background:#a998ff; top:48%; right:-7%; animation-delay:-5s; }
        .ambient-orb.three { background:#7be5e0; bottom:-8%; left:38%; animation-delay:-9s; }
        .sparkle { position:fixed; z-index:0; pointer-events:none; font-size:18px; opacity:.5;
            animation: sparkleBob 5s ease-in-out infinite; filter:drop-shadow(0 4px 10px #c084fc55); }
        .sparkle.s1 { top:22%; left:2%; } .sparkle.s2 { top:58%; right:3%; animation-delay:-2s; }
        .sparkle.s3 { top:82%; left:6%; animation-delay:-3.5s; }
        header, section, nav, main, #rewardModal { position:relative; }
        header { animation: riseIn .65s both; }
        .glass-card { border-radius: clamp(22px,3vw,42px); }
        .glass-card:hover { box-shadow:0 24px 60px -22px rgba(143,103,220,.28); }
        .glass-pill { border-radius:24px; }
        .tab-btn { position:relative; }
        .tab-btn:not(.opacity-60)::after { content:""; position:absolute; height:3px; bottom:5px; left:25%; right:25%;
            border-radius:99px; background:linear-gradient(90deg,var(--nb-pink),var(--nb-violet),var(--nb-cyan)); }
        button:focus-visible, input:focus-visible { outline:3px solid #a78bfa; outline-offset:3px; }
        button:disabled { opacity:.55; cursor:not-allowed; transform:none !important; }
        .progress-track { height:5px; position:fixed; top:0; left:0; width:100%; z-index:80; background:transparent; }
        #scrollProgress { height:100%; width:0; background:linear-gradient(90deg,#ff83bd,#9b7bff,#69dce8); transition:width .12s linear; }
        .section-kicker { display:inline-flex; align-items:center; gap:7px; padding:7px 11px; border-radius:999px;
            background:linear-gradient(120deg,#ff83bd20,#9b7bff20,#69dce820); font-size:10px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; }
        .micro-label { font-size:10px; letter-spacing:.13em; text-transform:uppercase; font-weight:800; opacity:.55; }
        .glass-card, .glass-pill { transition: background-color .35s ease, border-color .35s ease, box-shadow .35s ease, transform .25s ease; }
        #wimSphere { position:relative; box-shadow:0 18px 60px #9b7bff35, inset 0 0 28px #ffffff55; }
        #wimSphere::before { content:""; position:absolute; inset:-12px; border:1px solid #b9a4ff77; border-radius:50%; animation: orbitPulse 4s ease-in-out infinite; }
        #wimSphere::after { content:"✦"; position:absolute; top:8%; right:8%; color:#fff; font-size:20px; animation: sparkleBob 3s ease-in-out infinite; }
        .color-ball { position:relative; }
        .color-ball::after { content:""; position:absolute; inset:-5px; border:1px solid currentColor; border-radius:50%; opacity:0; transform:scale(.7); transition:.25s; }
        .color-ball.active-glow::after { opacity:.7; transform:scale(1.08); }
        .symbol-card { transition:transform .25s, background .25s, box-shadow .25s; }
        .symbol-card:hover { transform:translateY(-3px) rotate(-2deg); }
        .swish-image { border-radius:22px; }
        #rewardModal:not(.opacity-0) #rewardModalCard { animation: modalPop .35s cubic-bezier(.2,.9,.3,1.2) both; }
        .floating { will-change:transform; }
        @keyframes starDrift { from {background-position:0 0,0 0,0 0} to {background-position:120px 140px,-170px 180px,210px -190px} }
        @keyframes orbFloat { 0%,100% {transform:translate(0,0) scale(1)} 50% {transform:translate(24px,-32px) scale(1.12)} }
        @keyframes sparkleBob { 0%,100% {transform:translateY(0) rotate(0deg) scale(1)} 50% {transform:translateY(-13px) rotate(14deg) scale(1.12)} }
        @keyframes orbitPulse { 0%,100% {transform:scale(.98);opacity:.5} 50% {transform:scale(1.07);opacity:1} }
        @keyframes riseIn { from {opacity:0;transform:translateY(12px)} to {opacity:1;transform:translateY(0)} }
        @keyframes modalPop { from {transform:scale(.88) translateY(8px);opacity:0} to {transform:scale(1) translateY(0);opacity:1} }
        @media (prefers-reduced-motion: reduce) {
            *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.01ms !important; }
        }
        @media (max-width:640px) {
            header { align-items:flex-start; gap:12px; flex-wrap:wrap; }
            header > div:last-child { width:100%; justify-content:space-between; flex-wrap:wrap; }
            header > div:last-child > div { padding:8px 10px; }
            .glass-card { padding:20px; }
            #wimSphere { transform-origin:center; }
            #colorSpheresContainer { gap:10px; flex-wrap:wrap; }
            #colorSpheresContainer button { width:3.5rem; height:3.5rem; }
        }
    </style>

</head>
<body class="light pb-24">
    <div class="progress-track" aria-hidden="true"><div id="scrollProgress"></div></div>
    <div class="ambient-orbs" aria-hidden="true">
        <span class="ambient-orb one"></span><span class="ambient-orb two"></span><span class="ambient-orb three"></span>
    </div>
    <span class="sparkle s1" aria-hidden="true">✦</span>
    <span class="sparkle s2" aria-hidden="true">✧</span>
    <span class="sparkle s3" aria-hidden="true">✷</span>

    <!-- HEADER / NAVIGATION -->
    <header class="max-w-6xl mx-auto pt-6 px-4 flex justify-between items-center relative z-20">
        <div class="flex items-center space-x-3">
            <div class="w-12 h-12 rounded-3xl bg-gradient-to-tr from-pink-400 via-purple-400 to-indigo-400 flex items-center justify-center shadow-lg text-white font-black text-xl">
                🧠
            </div>
            <div>
                <h1 class="text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-purple-600 via-pink-500 to-cyan-500">
                    НейроПрограммирование
                </h1>
                <p class="text-xs font-semibold opacity-60">FOCUS LAB • ДЫХАНИЕ • ПАМЯТЬ • РЕЧЬ</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <!-- Theme Toggle Button -->
            <button onclick="toggleTheme()" class="glass-pill px-4 py-2 rounded-full flex items-center space-x-2 text-xs font-extrabold hover:opacity-80 shadow-sm bubble-btn">
                <i id="themeIcon" class="fas fa-moon text-amber-400"></i>
                <span id="themeText">Ночь</span>
            </button>

            <!-- Audio Toggle -->
            <button id="audioBtn" onclick="toggleAudio()" class="glass-pill px-4 py-2 rounded-full flex items-center space-x-2 text-xs font-extrabold shadow-sm bubble-btn">
                <i id="audioIcon" class="fas fa-volume-mute text-pink-400"></i>
                <span id="audioText">Альфа-Звук</span>
            </button>

            <!-- User XP -->
            <div class="glass-pill px-4 py-2 rounded-3xl flex items-center space-x-2 shadow-sm">
                <span class="text-xs font-bold opacity-60">Уровень <span id="userLevel" class="text-purple-500 font-extrabold">1</span></span>
                <span class="text-xs font-extrabold text-pink-500" id="userXP">0 XP</span>
            </div>
        </div>
    </header>

    <!-- HERO AFFIRMATION BANNER -->
    <section class="max-w-6xl mx-auto mt-6 px-4">
        <div class="glass-card rounded-5xl p-6 md:p-8 relative overflow-hidden floating">
            <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-6">
                <div class="space-y-2 text-center md:text-left">
                    <span class="inline-block px-3 py-1 bg-pink-500/10 text-pink-500 font-bold text-xs rounded-full uppercase tracking-wider">
                        Фундамент Силы Воли
                    </span>
                    <h2 id="affBanner" class="text-lg md:text-xl font-extrabold leading-relaxed">
                        То, куда ты направляешь свою волю и внимание, становится твоей реальностью.
                    </h2>
                    <p class="text-xs md:text-sm opacity-70 font-medium">
                        Сон, питание и физическая нагрузка — три главных источника вашей нейронной энергии.
                    </p>
                </div>
                <button onclick="nextAffirmation()" class="px-6 py-3 bg-gradient-to-r from-pink-400 to-purple-500 hover:from-pink-500 hover:to-purple-600 text-white font-bold rounded-2xl shadow-md bubble-btn shrink-0 text-xs md:text-sm flex items-center space-x-2">
                    <i class="fas fa-sparkles"></i>
                    <span>Новая Аффирмация</span>
                </button>
            </div>
        </div>
    </section>

    <!-- NAVIGATION TABS -->
    <nav class="max-w-6xl mx-auto mt-6 px-4">
        <div class="glass-card p-2 rounded-4xl flex space-x-2 justify-between max-w-4xl mx-auto overflow-x-auto">
            <button onclick="switchTab('wimhof')" id="tab-wimhof" class="tab-btn flex-1 py-3 px-4 rounded-3xl font-bold text-xs md:text-sm whitespace-nowrap transition-all duration-300 bg-white dark:bg-slate-800 text-purple-600 shadow-md">
                <i class="fas fa-wind mr-2"></i>Дыхание
            </button>
            <button onclick="switchTab('confidence')" id="tab-confidence" class="tab-btn flex-1 py-3 px-4 rounded-3xl font-bold text-xs md:text-sm whitespace-nowrap transition-all duration-300 opacity-60">
                <i class="fas fa-shield-halved mr-2"></i>Уверенность
            </button>
            <button onclick="switchTab('memory')" id="tab-memory" class="tab-btn flex-1 py-3 px-4 rounded-3xl font-bold text-xs md:text-sm whitespace-nowrap transition-all duration-300 opacity-60">
                <i class="fas fa-brain mr-2"></i>Память (3)
            </button>
            <button onclick="switchTab('speech')" id="tab-speech" class="tab-btn flex-1 py-3 px-4 rounded-3xl font-bold text-xs md:text-sm whitespace-nowrap transition-all duration-300 opacity-60">
                <i class="fas fa-microphone-alt mr-2"></i>Речь & НЛП (3)
            </button>
        </div>
    </nav>

    <!-- SECTION 1: BREATHING SYSTEM (WIM HOF + 4-7-8) -->
    <main id="section-wimhof" class="tab-content max-w-6xl mx-auto mt-6 px-4">
        <div class="glass-card rounded-5xl p-6 md:p-8 text-center">
            <h3 class="text-2xl font-black mb-2">Нейро-Практики Дыхания</h3>
            <p class="text-xs md:text-sm opacity-70 max-w-2xl mx-auto mb-6">
                Выберите режим ниже. Нажмите «Подробнее», чтобы изучить биологические механизмы и научную базу.
            </p>

            <!-- Mode Selector Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-5xl mx-auto mb-8">
                
                <!-- Card 1 -->
                <div class="glass-pill p-5 rounded-3xl text-left border-2 border-purple-400 flex flex-col justify-between" id="wbox-classic">
                    <div>
                        <div class="font-bold text-sm text-purple-500 mb-1 flex justify-between items-center">
                            <span>1. Классический Вим Хоф</span>
                            <button onclick="toggleBreathDesc('desc-classic')" class="text-xs px-2 py-1 bg-purple-500/10 text-purple-600 rounded-lg hover:bg-purple-500/20 bubble-btn">
                                Подробнее <i class="fas fa-chevron-down ml-1"></i>
                            </button>
                        </div>
                        <p class="text-xs font-semibold opacity-70">30 глубоких вдохов &rarr; Задержка дыхания &rarr; Восстановительный вдох (15 сек)</p>
                        
                        <div id="desc-classic" class="hidden mt-3 text-xs space-y-2 pt-2 border-t border-purple-200 dark:border-slate-700 leading-relaxed">
                            <p><b>Что происходит:</b> Интенсивное вымывание CO2 (гипокапния) и временное повышение pH крови (алкалоз).</p>
                            <p><b>Что делает организм:</b> Вызывает выброс адреналина и норадреналина без выделения кортизола (стрессового гормона). Активирует антивоспалительный отклик иммунной системы.</p>
                            <p><b>Чем помогает:</b> Повышает порог выносливости, приучает мозг сохранять покой при гипоксии и сильных внешних нагрузках.</p>
                        </div>
                    </div>
                    <button onclick="selectWimMode('classic')" class="mt-4 w-full py-2 bg-purple-500 text-white rounded-xl text-xs font-bold bubble-btn">
                        Выбрать Classic
                    </button>
                </div>

                <!-- Card 2 -->
                <div class="glass-pill p-5 rounded-3xl text-left flex flex-col justify-between" id="wbox-express">
                    <div>
                        <div class="font-bold text-sm text-pink-500 mb-1 flex justify-between items-center">
                            <span>2. Энерго-Экспресс</span>
                            <button onclick="toggleBreathDesc('desc-express')" class="text-xs px-2 py-1 bg-pink-500/10 text-pink-600 rounded-lg hover:bg-pink-500/20 bubble-btn">
                                Подробнее <i class="fas fa-chevron-down ml-1"></i>
                            </button>
                        </div>
                        <p class="text-xs font-semibold opacity-70">15 быстрых силовых циклов &rarr; Кратковременная задержка</p>
                        
                        <div id="desc-express" class="hidden mt-3 text-xs space-y-2 pt-2 border-t border-pink-200 dark:border-slate-700 leading-relaxed">
                            <p><b>Что происходит:</b> Скоростная стимуляция симпатической нервной системы диафрагмальными толчками.</p>
                            <p><b>Что делает организм:</b> Повышает уровень глюкозы в крови за счет выброса дофамина и адреналина, расширяет бронхи.</p>
                            <p><b>Чем помогает:</b> Ликвидирует сонливость, пробивает апатию, настраивает на волевой рывок перед сложной задачей.</p>
                        </div>
                    </div>
                    <button onclick="selectWimMode('express')" class="mt-4 w-full py-2 bg-pink-500 text-white rounded-xl text-xs font-bold bubble-btn">
                        Выбрать Express
                    </button>
                </div>

                <!-- Card 3 (UPDATED: 4-7-8 METHOD) -->
                <div class="glass-pill p-5 rounded-3xl text-left flex flex-col justify-between" id="wbox-relax">
                    <div>
                        <div class="font-bold text-sm text-cyan-500 mb-1 flex justify-between items-center">
                            <span>3. Метод 4-7-8 (Регенерация)</span>
                            <button onclick="toggleBreathDesc('desc-relax')" class="text-xs px-2 py-1 bg-cyan-500/10 text-cyan-600 rounded-lg hover:bg-cyan-500/20 bubble-btn">
                                Подробнее <i class="fas fa-chevron-down ml-1"></i>
                            </button>
                        </div>
                        <p class="text-xs font-semibold opacity-70">Вдох (4 сек) &rarr; Задержка (7 сек) &rarr; Медленный выдох (8 сек)</p>
                        
                        <div id="desc-relax" class="hidden mt-3 text-xs space-y-2 pt-2 border-t border-cyan-200 dark:border-slate-700 leading-relaxed">
                            <p><b>Для чего:</b> Мгновенное переключение нервной системы из состояния стресса («бей или беги») в состояние глубокого восстановления («отдыхай и восстанавливайся»).</p>
                            <p><b>Что делает:</b> Стимулирует блуждающий нерв (Nervus Vagus), мягко снижает пульс и замедляет волновую активность мозга до альфа- и тета-ритмов.</p>
                            <p><b>Чем помогает:</b> Быстро снимает ментальную тревогу, понижает артериальное давление, помогает легко засыпать и качественно восстанавливать силы.</p>
                        </div>
                    </div>
                    <button onclick="selectWimMode('relax')" class="mt-4 w-full py-2 bg-cyan-500 text-white rounded-xl text-xs font-bold bubble-btn">
                        Выбрать 4-7-8
                    </button>
                </div>

            </div>

            <!-- Breathing Sphere Visualizer -->
            <div class="relative w-64 h-64 mx-auto flex items-center justify-center my-6">
                <div id="wimSphere" class="w-48 h-48 rounded-full bg-gradient-to-tr from-pink-400 via-purple-400 to-cyan-400 shadow-2xl flex flex-col items-center justify-center text-white p-4 text-center">
                    <span id="wimStatus" class="font-black text-lg">Готов?</span>
                    <span id="wimCounter" class="text-xs font-extrabold opacity-90 mt-1">Нажми Старт</span>
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="flex justify-center items-center space-x-6 text-xs font-bold my-4">
                <div class="glass-pill px-4 py-2 rounded-2xl">
                    Фаза: <span id="wimPhaseText" class="text-purple-500">Подготовка</span>
                </div>
                <div class="glass-pill px-4 py-2 rounded-2xl">
                    Рекорд задержки: <span id="wimMaxHoldText" class="text-pink-500">0 сек</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex justify-center items-center space-x-4 max-w-md mx-auto mt-6">
                <button onclick="toggleWimHofSession()" id="wimStartBtn" class="px-8 py-3 bg-gradient-to-r from-pink-500 to-purple-600 text-white font-extrabold rounded-2xl shadow-lg bubble-btn text-sm w-full">
                    Начать Практику
                </button>
            </div>
        </div>
    </main>

